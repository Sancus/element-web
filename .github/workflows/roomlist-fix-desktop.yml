# Builds unsigned Element Desktop packages carrying the room list changes.
#
# Pushing the release branch runs the whole build and stops at the uploaded artifacts, so a
# candidate can be downloaded from the run and tested. Pushing a roomlist-fix-* tag runs the
# same build and publishes a GitHub Release from it.
#
# Separate from the upstream build_desktop_* workflows: those check out element-hq/element-web by
# name (so they ignore fork changes) and sign via eSigner / Apple notarisation.
#
# Targets match what Element normally ships, minus the installers that only make sense signed:
#   Linux    tar.gz, deb
#   macOS    dmg, zip  (universal)
#   Windows  zip       (portable)
#
# matrix-seshat (encrypted search) is compiled per platform through hak and verified inside the
# packaged app, which is why each platform sets up Rust and, on Windows, Tcl and NASM.

name: Room list fix - desktop builds

on:
    workflow_dispatch:
    push:
        branches:
            - release
        tags:
            - "roomlist-fix-*"

permissions:
    contents: read

jobs:
    # Build the web app once and share it with every platform, rather than rebuilding per runner.
    prepare:
        name: Prepare webapp.asar
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: apps/desktop/.node-version
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web app
              working-directory: apps/web
              run: pnpm build
              env:
                  NX_DAEMON: "false"

            - name: Pack webapp.asar
              working-directory: apps/desktop
              run: |
                  set -euo pipefail
                  rm -rf webapp webapp.asar
                  cp -r ../web/webapp webapp

                  # The app will not start without a config. Strip update_base_url so these builds
                  # never auto-update themselves back to official Element and drop the fix.
                  node -e '
                    const fs = require("fs");
                    const config = JSON.parse(fs.readFileSync("element.io/release/config.json", "utf8"));
                    delete config.update_base_url;
                    fs.writeFileSync("webapp/config.json", JSON.stringify(config, null, 4));
                  '

                  node -e 'require("@electron/asar").createPackage("webapp","webapp.asar").then(()=>console.log("packed webapp.asar"))'

            # Cheaper and more reliable than checking each platform's unpacked output, and it fails
            # before any of the three builds start.
            - name: Verify the fix is in webapp.asar
              working-directory: apps/desktop
              run: |
                  node -e '
                    const asar = require("@electron/asar");
                    // Both halves have to survive the build: the compound-web fix (a closed label
                    // tooltip renders as a bare hidden span) and the row-level hover gating on top.
                    const want = {
                      "compound-web tooltip fix": (b) => b.includes(`inlineSize:"1px"`) && b.includes(`clipPath:"inset(50%)"`),
                      "gated avatar tooltip": (b) => b.includes("mx_RoomAvatarView") && b.includes("onMouseLeave"),
                    };
                    const found = new Set();
                    for (const f of asar.listPackage("webapp.asar").filter((f) => f.endsWith(".js"))) {
                      const buf = asar.extractFile("webapp.asar", f.replace(/^[\\/]/, ""));
                      for (const [name, test] of Object.entries(want)) if (test(buf)) found.add(name);
                    }
                    const missing = Object.keys(want).filter((n) => !found.has(n));
                    if (missing.length) throw new Error(`not in webapp.asar: ${missing.join(", ")}`);
                    console.log("fix verified in webapp.asar");
                  '

            - uses: actions/upload-artifact@v7
              with:
                  name: webapp-asar
                  path: apps/desktop/webapp.asar
                  retention-days: 1

    build:
        name: Build ${{ matrix.name }}
        needs: prepare
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Matching upstream's runner: building on a newer Ubuntu would raise the glibc
                    # requirement of the resulting packages.
                    - name: linux-x64
                      runs-on: ubuntu-22.04
                      args: -l tar.gz deb
                      target: x86_64-unknown-linux-gnu
                      # No system sqlcipher in the build container, so seshat links its own.
                      sqlcipher_bundled: "1"
                    - name: macos-universal
                      runs-on: macos-26
                      args: -m dmg zip --universal
                      target: universal-apple-darwin
                      sqlcipher_bundled: ""
                    - name: windows-x64
                      runs-on: windows-2025
                      args: -w zip
                      target: x86_64-pc-windows-msvc
                      sqlcipher_bundled: ""
        runs-on: ${{ matrix.runs-on }}
        env:
            SQLCIPHER_BUNDLED: ${{ matrix.sqlcipher_bundled }}
        steps:
            # nx misbehaves with CRLF checkouts: https://github.com/nrwl/nx/issues/35828
            - name: Configure git line endings
              if: runner.os == 'Windows'
              run: |
                  git config --system core.autocrlf false
                  git config --system core.eol lf

            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@v8
              with:
                  name: webapp-asar
                  path: apps/desktop/

            # Cache hak's complete output: Rust/C dependencies and the shippable module.
            - name: Cache hak native build
              id: hak-cache
              uses: actions/cache@v6
              with:
                  key: hak-seshat-v2-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/package.json', 'apps/desktop/.node-version', 'apps/desktop/hak/**', 'apps/desktop/scripts/hak/**', 'apps/desktop/dockerbuild/**') }}
                  path: apps/desktop/.hak

            - name: Install Rust targets
              if: runner.os == 'macOS' && steps.hak-cache.outputs.cache-hit != 'true'
              run: |
                  rustup toolchain install stable --profile minimal --no-self-update
                  rustup default stable
                  rustup target add aarch64-apple-darwin
                  rustup target add x86_64-apple-darwin

            - uses: maxim-lobanov/setup-xcode@v1
              if: runner.os == 'macOS' && steps.hak-cache.outputs.cache-hit != 'true'
              with:
                  xcode-version: latest-stable

            - name: Install Windows native prerequisites
              if: runner.os == 'Windows' && steps.hak-cache.outputs.cache-hit != 'true'
              shell: pwsh
              run: |
                  choco install -y magicsplat-tcl-tk nasm --no-progress
                  "${HOME}/AppData/Local/Apps/Tcl86/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                  "C:/Program Files/NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

            - name: Install Windows Rust target
              if: runner.os == 'Windows' && steps.hak-cache.outputs.cache-hit != 'true'
              shell: powershell
              run: |
                  rustup toolchain install stable --profile minimal --no-self-update
                  rustup default stable
                  rustup target add $env:TARGET
              env:
                  TARGET: ${{ matrix.target }}

            - name: Set up Windows build tools
              if: runner.os == 'Windows' && steps.hak-cache.outputs.cache-hit != 'true'
              uses: ilammy/msvc-dev-cmd@v1
              with:
                  arch: x64

            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: apps/desktop/.node-version
                  cache: pnpm

            - name: Install dependencies
              working-directory: apps/desktop
              run: pnpm install --frozen-lockfile --filter element-desktop

            # The build container writes as root, so the workspace has to be handed back to the
            # runner user before electron-builder touches it.
            - name: Build Linux native module
              if: runner.os == 'Linux' && steps.hak-cache.outputs.cache-hit != 'true'
              run: |
                  docker pull ghcr.io/element-hq/element-web/desktop-build-env:develop
                  docker run --rm \
                    -v "${{ github.workspace }}:/work" -w /work \
                    -e SQLCIPHER_BUNDLED \
                    -e CI=1 \
                    ghcr.io/element-hq/element-web/desktop-build-env:develop \
                    pnpm -C apps/desktop run build:native
                  shopt -s globstar
                  sudo chown -R "$USER:$USER" apps/desktop/.hak **/node_modules

            # A universal package needs both architectures compiled before they can be linked.
            - name: Build macOS universal native module
              if: runner.os == 'macOS' && steps.hak-cache.outputs.cache-hit != 'true'
              working-directory: apps/desktop
              run: pnpm run build:native:universal

            - name: Build Windows native module
              if: runner.os == 'Windows' && steps.hak-cache.outputs.cache-hit != 'true'
              working-directory: apps/desktop
              shell: powershell
              run: |
                  refreshenv
                  pnpm run build:native --target $env:TARGET
              env:
                  TARGET: ${{ matrix.target }}

            # Save successful native compilation before packaging so later failures do not
            # force sqlcipher and matrix-seshat to be rebuilt on the next iteration.
            - name: Save hak native build
              if: steps.hak-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v6
              with:
                  key: hak-seshat-v2-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/package.json', 'apps/desktop/.node-version', 'apps/desktop/hak/**', 'apps/desktop/scripts/hak/**', 'apps/desktop/dockerbuild/**') }}
                  path: apps/desktop/.hak

            # hak finishes by running "pnpm link" on the module it built, which adds it to the
            # workspace root, rewrites pnpm-lock.yaml and reformats pnpm-workspace.yaml.
            # electron-builder reads the lockfile to decide what to package, and against the
            # rewritten one it cannot place import-in-the-middle and its siblings, so it drops
            # them with only a warning: v7 shipped that way and would not start.
            #
            # Restoring the checked-in files and reinstalling puts the workspace back exactly as
            # it was before hak ran. Losing the link costs nothing here: electron-builder takes
            # the module from .hak/hakModules, and tsc uses the declaration in src/@types.
            - name: Restore the dependency tree
              shell: bash
              run: |
                  set -euo pipefail
                  git checkout -- package.json pnpm-lock.yaml pnpm-workspace.yaml
                  rm -rf apps/desktop/node_modules
                  pnpm install --frozen-lockfile --filter element-desktop

            - uses: actions/setup-python@v7
              if: runner.os == 'macOS'
              with:
                  python-version: "3.13"

            # https://github.com/electron-userland/electron-builder/issues/9511
            - name: Install electron-builder dmg dependency
              if: runner.os == 'macOS'
              run: sudo pip3 install pyobjc-framework-Quartz

            - name: Build package
              working-directory: apps/desktop
              shell: bash
              run: |
                  set -euo pipefail
                  pnpm exec tsc
                  node scripts/copy-res.ts
                  pnpm exec electron-builder ${{ matrix.args }} --publish never
              env:
                  # Without this electron-builder hunts for a keychain identity and fails the build.
                  # CSC_LINK is deliberately left unset rather than empty; empty upsets it.
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"
                  USE_HARD_LINKS: "false"

            # Proves matrix-seshat actually shipped, rather than the app silently falling back to
            # "no encrypted search" the way the earlier stubbed builds did, and that everything the
            # main process imports is packaged with it. Both failures are invisible until launch.
            - name: Verify the packaged app
              working-directory: apps/desktop
              shell: bash
              run: |
                  set -euo pipefail
                  shopt -s nullglob

                  asars=(
                    dist/*/resources/app.asar
                    dist/*/*.app/Contents/Resources/app.asar
                  )
                  native_modules=(
                    dist/*/resources/app.asar.unpacked/node_modules/matrix-seshat/*.node
                    dist/*/*.app/Contents/Resources/app.asar.unpacked/node_modules/matrix-seshat/*.node
                  )
                  test "${#asars[@]}" -gt 0 || { echo "packaged app.asar not found"; exit 1; }
                  test "${#native_modules[@]}" -gt 0 || { echo "packaged matrix-seshat native module not found"; exit 1; }

                  node ../../.github/scripts/verify-packaged-deps.mjs "${asars[0]}" matrix-seshat

                  printf 'matrix-seshat native module: %s\n' "${native_modules[0]}"

            - name: Collect distributables
              shell: bash
              working-directory: apps/desktop
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  mkdir -p out
                  distributables=(dist/*.dmg dist/*.zip dist/*.deb dist/*.tar.gz)
                  test "${#distributables[@]}" -gt 0 || { echo "no distributables produced"; exit 1; }
                  cp "${distributables[@]}" out/
                  ls -la out

            - uses: actions/upload-artifact@v7
              with:
                  name: dist-${{ matrix.name }}
                  path: apps/desktop/out/*
                  retention-days: 14

    release:
        name: Publish release
        needs: build
        if: github.ref_type == 'tag'
        runs-on: ubuntu-latest
        permissions:
            contents: write # to create the release
        steps:
            - uses: actions/download-artifact@v8
              with:
                  pattern: dist-*
                  path: dist
                  merge-multiple: true

            # The notes are written with a quoted heredoc so backticks and quotes survive, then the
            # tag is substituted in: the screenshot is fetched from the tag rather than a branch, so
            # a release keeps showing the layout it shipped with.
            - name: Publish
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  ls -la dist
                  cat > notes.md <<'NOTES'
                  Unofficial build of Element Desktop with the room list scroll fix and these room list options:

                  - **Scroll performance** the room list no longer drops frames on long lists; each row used to keep several closed tooltips running position-tracking loops.
                  - **Compact layout** a 32px row with a 26px avatar, roughly 60% more rooms on screen. Message previews cannot fit, so they are off while it is on. Room list three-dot menu.
                  - **People section** collects the direct messages that no other section claims, and takes rooms you move into it by hand. Same menu, "Show People section".
                  - **Per-section sorting** each section's menu can pin Latest activity / Unread first / A-Z, or follow the list-wide order.

                  ![Default and compact room list side by side](https://raw.githubusercontent.com/__REPO__/__TAG__/.github/release-assets/compact-layout.png)

                  Encrypted-room search works in these builds: matrix-seshat is compiled in, unlike the earlier roomlist-fix releases.

                  These builds are **unsigned** and they will use your existing profile:

                  - **Windows** SmartScreen will warn on first run. This is a portable zip, there is nothing to install, just run Element.exe.
                  - **macOS** Gatekeeper will refuse to open it. Clear the quarantine flag with `xattr -dr com.apple.quarantine /Applications/Element.app`.
                  - **Linux** no signature to check.

                  Auto-update is disabled, so these will never replace themselves with official Element. Run with `--profile roomlist-fix` to keep the data directory separate from an existing Element install.
                  NOTES
                  sed -i "s|__TAG__|$TAG|g; s|__REPO__|$GITHUB_REPOSITORY|g" notes.md
                  gh release create "$TAG" dist/* \
                    --repo "$GITHUB_REPOSITORY" \
                    --title "Room list fixes - $TAG" \
                    --notes-file notes.md
